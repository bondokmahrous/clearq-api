<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClearQ — Logo Animation</title>
<style>
  :root { --teal: #295852; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--teal);
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 40px;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    overflow-x: hidden;
  }
  .fit   { display: flex; justify-content: center; }
  .stage {
    position: relative; width: 1043px; height: 333px;
    transform-origin: top center;
  }
  .stage img { display: block; user-select: none; -webkit-user-drag: none; }
  .base { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* junction detail of the Q — appears only once the car has docked */
  .notch {
    position: absolute; left: 802px; top: 93px;
    opacity: 1; z-index: 1;
  }

  .mover {
    position: absolute; left: 0; top: 0; z-index: 2;
    width: 102px; height: 132px;
    offset-path: path('M -180 322 L 590 322 C 750 322, 854.0 306, 854.0 242 L 854.0 160.0');
    offset-anchor: 50% 50%;
    offset-rotate: auto 90deg;
    offset-distance: 100%;
    will-change: transform;
  }
  @supports not (offset-path: path('M0 0 L1 1')) {
    .mover { left: 803px; top: 94px; offset-rotate: none; }
  }

  .lean   { width: 100%; height: 100%; }
  .settle { position: relative; width: 100%; height: 100%; }
  .settle > img { position: absolute; inset: 0; width: 100%; }
  .car-img { z-index: 2; }
  .ghost {
    z-index: 1; opacity: 0;
    filter: drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff)
            drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff);
  }
  .dirt { z-index: 3; opacity: 0; }
  .foam {
    position: absolute; z-index: 4;
    left: -14px; top: -14px; width: 130px;
    opacity: 0;
  }
  .bubbles { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
  .bubbles i {
    position: absolute; border: 2px solid rgba(255,255,255,.95);
    border-radius: 50%; background: rgba(255,255,255,.25); opacity: 0;
  }
  .bubbles i:nth-child(1) { left: 12px; top: 34px; width: 10px; height: 10px; }
  .bubbles i:nth-child(2) { left: 74px; top: 22px; width: 14px; height: 14px; }
  .bubbles i:nth-child(3) { left: 40px; top: 70px; width: 8px;  height: 8px;  }
  .bubbles i:nth-child(4) { left: 82px; top: 88px; width: 11px; height: 11px; }
  .drops { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
  .drops i {
    position: absolute; width: 5px; height: 9px;
    background: #fff; border-radius: 50% 50% 60% 60%; opacity: 0;
  }
  .drops i:nth-child(1) { left: 16px; top: 96px; }
  .drops i:nth-child(2) { left: 46px; top: 108px; }
  .drops i:nth-child(3) { left: 78px; top: 100px; }
  .drops i:nth-child(4) { left: 30px; top: 116px; }
  .drops i:nth-child(5) { left: 64px; top: 120px; }
  .sparkles { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
  .sparkles i {
    position: absolute; background: #fff;
    clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
    opacity: 0; transform: scale(0);
  }
  .sparkles i:nth-child(1) { left: 18px; top: 26px; width: 20px; height: 20px; }
  .sparkles i:nth-child(2) { left: 66px; top: 54px; width: 15px; height: 15px; }
  .sparkles i:nth-child(3) { left: 34px; top: 92px; width: 17px; height: 17px; }

  /* ------------------------- timeline ------------------------- */

  .play .mover  { animation: travel 4.4s both; }
  .play .lean   { animation: lean 4.4s ease-in-out both; }
  .play .ghost  { animation: keyline 4.4s linear both; }
  .play .dirt   { animation: dirtfade 4.4s linear both; }
  .play .foam   { animation: foamwash 4.4s ease-in-out both; }
  .play .notch  { animation: notchin 4.4s linear both; }
  .play .bubbles i { animation: bubble 4.4s ease-out both; }
  .play .bubbles i:nth-child(2) { animation-delay: .18s; }
  .play .bubbles i:nth-child(3) { animation-delay: .38s; }
  .play .bubbles i:nth-child(4) { animation-delay: .55s; }
  .play .drops i { animation: drop 4.4s ease-in both; }
  .play .drops i:nth-child(2) { animation-delay: .1s; }
  .play .drops i:nth-child(3) { animation-delay: .2s; }
  .play .drops i:nth-child(4) { animation-delay: .28s; }
  .play .drops i:nth-child(5) { animation-delay: .36s; }
  .play .settle { animation: parkdip .4s 4.4s ease-out both; }
  .play .sparkles i:nth-child(1) { animation: twinkle .55s 4.550000000000001s ease-out both; }
  .play .sparkles i:nth-child(2) { animation: twinkle .55s 4.78s ease-out both; }
  .play .sparkles i:nth-child(3) { animation: twinkle .55s 5.0s ease-out both; }

  @keyframes travel {
    0%   { offset-distance: 0%;    animation-timing-function: cubic-bezier(.3,.35,.5,1); }
    62%  { offset-distance: 75%;   animation-timing-function: cubic-bezier(.4,0,.4,1); }
    90%  { offset-distance: 96.5%; animation-timing-function: cubic-bezier(.33,0,.3,1); }
    100% { offset-distance: 100%; }
  }
  @keyframes lean {
    0%, 16% { transform: rotate(0deg); }
    22%     { transform: rotate(1.4deg); }
    30%     { transform: rotate(-1.6deg); }
    38%     { transform: rotate(1.4deg); }
    46%     { transform: rotate(-1.2deg); }
    54%     { transform: rotate(0deg); }
    74%     { transform: rotate(-3.5deg); }
    88%     { transform: rotate(1.8deg); }
    100%    { transform: rotate(0deg); }
  }
  @keyframes keyline {
    0%, 90%  { opacity: 1; }
    98%,100% { opacity: 0; }
  }
  /* the Q stays a plain solid Q until the car is basically in it */
  @keyframes notchin {
    0%, 92%  { opacity: 0; }
    99%,100% { opacity: 1; }
  }
  @keyframes dirtfade {
    0%, 32%  { opacity: .95; }
    54%,100% { opacity: 0; }
  }
  @keyframes foamwash {
    0%, 15%  { opacity: 0; transform: translateY(0); }
    24%      { opacity: .55; }
    30%, 52% { opacity: 1; transform: translateY(0); }
    68%,100% { opacity: 0; transform: translateY(34px); }
  }
  @keyframes bubble {
    0%, 26%  { opacity: 0; transform: translate(0,0) scale(.4); }
    32%      { opacity: 1; }
    50%      { opacity: .9; transform: translate(6px, 34px) scale(1); }
    60%,100% { opacity: 0; transform: translate(10px, 58px) scale(1.15); }
  }
  @keyframes drop {
    0%, 52%  { opacity: 0; transform: translate(0,0); }
    56%      { opacity: 1; }
    68%,100% { opacity: 0; transform: translate(-4px, 46px); }
  }
  @keyframes parkdip {
    0%   { transform: translateY(0); }
    45%  { transform: translateY(2.5px); }
    100% { transform: translateY(0); }
  }
  @keyframes twinkle {
    0%   { opacity: 0; transform: scale(0) rotate(0deg); }
    40%  { opacity: 1; transform: scale(1) rotate(45deg); }
    100% { opacity: 0; transform: scale(0) rotate(90deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .play .mover, .play .lean, .play .ghost, .play .dirt, .play .foam,
    .play .notch, .play .bubbles i, .play .drops i, .play .settle,
    .play .sparkles i { animation: none; }
  }

  .controls { display: flex; gap: 14px; align-items: center; }
  button {
    font-family: inherit; font-weight: 600; font-size: 15px;
    letter-spacing: .02em; color: #fff; background: transparent;
    border: 1.5px solid rgba(255,255,255,.45); border-radius: 999px;
    padding: 10px 26px; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  button:hover { border-color: #fff; background: rgba(255,255,255,.08); }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  label {
    color: rgba(255,255,255,.75); font-size: 14px; font-weight: 600;
    display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none;
  }
  input[type="checkbox"] { accent-color: #fff; width: 15px; height: 15px; cursor: pointer; }
</style>
</head>

<script>
  const stage = document.getElementById('stage');
  const fit   = document.querySelector('.fit');
  function resize() {
    const s = Math.min(1, (window.innerWidth * 0.92) / 1043);
    stage.style.transform = 'scale(' + s + ')';
    fit.style.height = (333 * s) + 'px';
  }
  resize();
  window.addEventListener('resize', resize);
  function notifyDone() {
    if (window.parent && window.parent !== window) window.parent.postMessage('clearq-intro-done', '*');
  }
  stage.addEventListener('animationend', (e) => {
    if (e.animationName === 'parkdip') setTimeout(notifyDone, 550);
  });
  // Fallback in case animationend never fires (reduced-motion, slow paint, etc.)
  setTimeout(notifyDone, 6000);
</script>
